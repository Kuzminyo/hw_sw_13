{% with link=protocol|add:"://"|add:domain %}
<p>Hi {{ user.get_username }}!</p>
<p>You asked to reset your password on Quotes to Scrape.</p>
<p><a href="{{ link }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}">Choose a new password</a></p>
<p>If you did not ask for it, just ignore this email - your password stays the same.</p>
{% endwith %}
