{% extends 'base.html' %}

{% block title %}{{ title }} | Quotes to Scrape{% endblock %}

{% block content %}
<div class="form-box">
    <h2>{{ title }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save</button>
    </form>
</div>
{% endblock %}
